[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    server_only: mark test to run only with --server
    local_only: mark test to run only in local mode
    slow: mark test as slow running
    integration: mark test requiring a live Syfter server
    auth: authentication and admin key tests
    pg_only: PostgreSQL-specific tests (skip on SQLite unit tests)
    unit: in-process unit tests

# Default options
addopts =
    -v
    --tb=short
    -m "not server_only and not integration"

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
